name: Build Tk Persistent UI

on:
  push:
    branches:
      - build/tk-persistent-ui-20260911
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name jinlang-office-fahuo-tk jinlang_fahuo_push.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jinlang-office-fahuo-tk-windows
          path: dist/jinlang-office-fahuo-tk.exe
          if-no-files-found: error
